{% extends 'base.html' %}

{% block title %}Password Reset Complete — Mindly{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-hover mindly-panel p-4">
            <div class="text-center mb-4">
                <i class="fas fa-check-circle fa-2x mindly-icon" style="color: var(--mindly-success);"></i>
            </div>
            
            <h1 class="h3 mb-3 text-center mindly-panel-title">Password Reset Complete</h1>
            <p class="text-center mindly-panel-text">
                Your password has been successfully reset. You can now log in with your new password.
            </p>

            <p class="text-center mt-4">
                <a href="{% url 'users:login' %}" class="btn btn-mindly">Log In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
