<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="130" viewBox="0 0 1100 130" role="img" aria-labelledby="title desc">
  <title id="title">Primary Colours Chart</title>
  <desc id="desc">Primary colour swatches for Mindly with names and hex codes.</desc>
  <style>
    .title { font: 700 18px Arial, sans-serif; fill: #2e2f31; }
    .swatchTextDark { font: 700 14px Arial, sans-serif; fill: #2e2f31; }
    .swatchTextLight { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #d8d8d8; stroke-width: 1; }
  </style>

  <text class="title" x="18" y="22">Primary Colours</text>

  <g transform="translate(18,38)">
    <rect x="0" y="0" width="260" height="62" rx="8" fill="#f5f3ef" class="panel"/>
    <rect x="270" y="0" width="260" height="62" rx="8" fill="#fffdf9" class="panel"/>
    <rect x="540" y="0" width="260" height="62" rx="8" fill="#6c9b7f" class="panel"/>
    <rect x="810" y="0" width="260" height="62" rx="8" fill="#4a5d54" class="panel"/>

    <text class="swatchTextDark" x="130" y="25" text-anchor="middle">Background</text>
    <text class="swatchTextDark" x="130" y="44" text-anchor="middle">#f5f3ef</text>

    <text class="swatchTextDark" x="400" y="25" text-anchor="middle">Container</text>
    <text class="swatchTextDark" x="400" y="44" text-anchor="middle">#fffdf9</text>

    <text class="swatchTextLight" x="670" y="25" text-anchor="middle">Primary Action</text>
    <text class="swatchTextLight" x="670" y="44" text-anchor="middle">#6c9b7f</text>

    <text class="swatchTextLight" x="940" y="25" text-anchor="middle">Secondary</text>
    <text class="swatchTextLight" x="940" y="44" text-anchor="middle">#4a5d54</text>
  </g>
</svg>